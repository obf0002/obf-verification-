<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBF Member Verification</title><style>
body{margin:0;font-family:Arial;background:#f5f7f6}.card{max-width:520px;margin:35px auto;background:white;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px #0002}.head{text-align:center;padding:28px;border-top:12px solid #d91645;border-bottom:6px solid #087443}.logo{font-size:42px;font-weight:900}.brand{font-size:18px;font-weight:800}.sub{font-size:12px;letter-spacing:3px}.body{padding:28px}.ok{background:#e9f7ef;color:#087443;padding:14px;border-radius:10px;font-weight:900;text-align:center}.bad{background:#fdecef;color:#d91645;padding:14px;border-radius:10px;font-weight:900;text-align:center}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;gap:15px}.label{color:#666}.value{font-weight:bold;text-align:right}.motto{text-align:center;color:#087443;font-style:italic;font-weight:bold;font-size:17px;margin:25px 0}.foot{background:#087443;color:white;text-align:center;padding:17px;font-size:11px}</style></head><body><div class="card"><div class="head"><div class="logo">OBF</div><div class="brand">ONE BIG FAMILY</div><div class="sub">ASSOCIATION ABUJA</div></div><div class="body" id="r">Verifying...</div><div class="foot">ONE FAMILY • ONE LOVE • ONE MOVEMENT</div></div><script>
const R={id:"OBF/ABA/2026/0057",name:"OBF Member 0057",category:"MEMBER",status:"ACTIVE",year:"2026",hash:"afab645041345512c8b54d26d8ebd8efd7d8a0ef5c524d14e9632465ca925f46"};
async function sha(s){let b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
(async()=>{let p=new URLSearchParams(location.search),id=p.get("mid")||"",t=p.get("token")||"",r=document.getElementById("r");if(id!==R.id||!t||(await sha(t))!==R.hash||R.status!=="ACTIVE"){r.innerHTML='<h2>Verification Failed</h2><div class="bad">INVALID OBF MEMBERSHIP</div><p>The member ID or verification token is invalid.</p>';return}r.innerHTML='<h2 style="text-align:center">Valid OBF Member</h2><div class="ok">VALID — ACTIVE OBF MEMBER</div><div class="row"><span class="label">Name</span><span class="value">'+R.name+'</span></div><div class="row"><span class="label">Member ID</span><span class="value">'+R.id+'</span></div><div class="row"><span class="label">Category</span><span class="value">'+R.category+'</span></div><div class="row"><span class="label">Status</span><span class="value">'+R.status+'</span></div><div class="row"><span class="label">Year Joined</span><span class="value">'+R.year+'</span></div><div class="motto">One Family. One Love. One Movement.</div>'})();
</script></body></html>
